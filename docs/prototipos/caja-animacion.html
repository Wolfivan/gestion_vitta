<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caja de mensajes</title>
<!--
  Prototipo de la animación de la Caja de mensajes (feature 114, Tarea 8).
  Sin dependencias: SVG + Web Animations API. Cada fase usa transformaciones simples
  (rotate, translate, scale, opacity) y curvas cubic-bezier, que se copian 1:1 a
  Reanimated con withSequence / withTiming / Easing.bezier(...).
  Colores copiados de App/src/constants/index.ts (COLORS).
-->
<style>
  :root {
    --background: #fbf9f8;
    --surface: #ffffff;
    --surfaceContainerLow: #f5f3f3;
    --surfaceVariant: #e4e2e2;
    --primary: #2d6182;
    --primaryContainer: #487a9c;
    --primaryFixed: #c9e6ff;
    --primaryFixedDim: #9bccf2;
    --secondary: #4a654f;
    --secondaryContainer: #c9e7cc;
    --tertiaryFixed: #e5e2db;
    --accent: #e94560;
    --text: #1b1c1c;
    --textSecondary: #41474d;
    --textMuted: #999999;
    --scrim: rgba(27, 28, 28, 0.2);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--background); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; align-items: flex-start;
    padding: 24px 16px;
  }
  .phone {
    width: 360px; max-width: 100%; height: 720px; background: var(--background);
    border: 1px solid var(--surfaceVariant); border-radius: 36px; position: relative; overflow: hidden;
    box-shadow: 0 12px 40px rgba(27,28,28,.08); display: flex; flex-direction: column; align-items: center;
  }
  .phone header { width: 100%; padding: 28px 24px 0; }
  .phone h1 { font-size: 22px; margin: 0 0 4px; color: var(--primary); }
  .phone .sub { margin: 0; font-size: 14px; color: var(--textSecondary); }
  .stage { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; position: relative; }
  #box { width: 240px; height: 240px; cursor: pointer; overflow: visible; outline: none; }
  #box:focus-visible { filter: drop-shadow(0 0 0 3px var(--primaryFixedDim)); }
  .hint { font-size: 14px; color: var(--textMuted); margin: 0 0 12px; }
  .count { font-size: 13px; color: var(--textSecondary); margin: 0 0 28px; }
  .scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; pointer-events: none; }
  .card {
    position: absolute; left: 50%; top: 50%; width: 280px; padding: 28px 24px 20px;
    background: var(--surface); border-radius: 24px; box-shadow: 0 16px 40px rgba(27,28,28,.16);
    transform: translate(-50%, -50%) scale(.2); opacity: 0; pointer-events: none; text-align: center;
  }
  .card p.msg { font-size: 19px; line-height: 1.45; margin: 0 0 14px; color: var(--text); }
  .card p.author { font-size: 14px; color: var(--secondary); margin: 0 0 20px; font-style: italic; }
  .card .actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .card button, .panel button {
    border: 0; border-radius: 999px; padding: 10px 16px; font-size: 14px; cursor: pointer; font-family: inherit;
  }
  .btn-primary { background: var(--primary); color: var(--surface); }
  .btn-soft { background: var(--primaryFixed); color: var(--primary); }
  .btn-danger { background: transparent; color: var(--accent); }
  .panel { width: 340px; max-width: 100%; background: var(--surface); border-radius: 20px; padding: 20px; border: 1px solid var(--surfaceVariant); }
  .panel h2 { font-size: 16px; margin: 0 0 12px; color: var(--primary); }
  .panel label { display: block; font-size: 13px; color: var(--textSecondary); margin: 12px 0 4px; }
  .panel input[type=range] { width: 100%; accent-color: var(--primary); }
  .panel .row { display: flex; gap: 8px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
  .panel code { font-size: 12px; background: var(--surfaceContainerLow); padding: 8px; border-radius: 8px; display: block; white-space: pre-wrap; margin-top: 12px; color: var(--textSecondary); }
  .panel small { color: var(--textMuted); }
</style>
</head>
<body>

<div class="phone" aria-label="Vista previa en el teléfono">
  <header>
    <h1>Caja de mensajes</h1>
    <p class="sub">Toca la caja cuando necesites un poco de ánimo.</p>
  </header>

  <div class="stage">
    <svg id="box" viewBox="0 0 240 240" role="button" tabindex="0" aria-label="Abrir la caja de mensajes">
      <!-- sombra -->
      <ellipse id="shadow" cx="120" cy="214" rx="78" ry="9" fill="var(--surfaceVariant)"/>
      <!-- partículas (salen del centro de la caja) -->
      <g id="particles"></g>
      <!-- todo lo que se balancea: cuerpo + tapa -->
      <g id="wobble" style="transform-origin: 120px 210px; transform-box: view-box;">
        <!-- cuerpo -->
        <rect x="46" y="112" width="148" height="98" rx="10" fill="var(--primaryContainer)"/>
        <rect x="46" y="112" width="148" height="14" fill="var(--primary)" opacity=".35"/>
        <rect x="111" y="112" width="18" height="98" fill="var(--primaryFixed)"/>
        <!-- tapa: gira sobre su borde trasero izquierdo -->
        <g id="lid" style="transform-origin: 38px 112px; transform-box: view-box;">
          <rect x="38" y="88" width="164" height="28" rx="8" fill="var(--primary)"/>
          <rect x="111" y="88" width="18" height="28" fill="var(--primaryFixed)"/>
          <!-- lazo -->
          <path d="M120 88 C 98 60, 74 70, 88 86 C 96 94, 112 90, 120 88 Z" fill="var(--secondaryContainer)" stroke="var(--secondary)" stroke-width="2"/>
          <path d="M120 88 C 142 60, 166 70, 152 86 C 144 94, 128 90, 120 88 Z" fill="var(--secondaryContainer)" stroke="var(--secondary)" stroke-width="2"/>
          <circle cx="120" cy="88" r="7" fill="var(--secondary)"/>
        </g>
      </g>
    </svg>
  </div>

  <p class="hint" id="hint">Toca la caja</p>
  <p class="count">5 mensajes en tu caja</p>

    <div class="scrim" id="scrim"></div>
    <div class="card" id="card" role="dialog" aria-live="polite">
      <p class="msg" id="msg"></p>
      <p class="author" id="author"></p>
      <div class="actions">
        <button class="btn-soft" id="close">Cerrar</button>
        <button class="btn-primary" id="again">Abrir otro</button>
        <button class="btn-danger" id="del">Borrar este mensaje</button>
      </div>
    </div>
</div>

<div class="panel">
  <h2>Ajustes del prototipo</h2>
  <small>Mueve los tiempos hasta que te guste y dime los valores. Se copian tal cual a la app.</small>

  <label>1. Balanceo: <b id="v-wobble"></b> ms</label>
  <input type="range" id="t-wobble" min="0" max="1200" step="50" value="400">
  <label>2. Se abre la tapa: <b id="v-lid"></b> ms</label>
  <input type="range" id="t-lid" min="100" max="1200" step="50" value="350">
  <label>3. Partículas: <b id="v-particles"></b> ms</label>
  <input type="range" id="t-particles" min="0" max="1200" step="50" value="300">
  <label>4. Sube la tarjeta: <b id="v-card"></b> ms</label>
  <input type="range" id="t-card" min="100" max="1500" step="50" value="550">

  <div class="row">
    <label style="margin:0"><input type="checkbox" id="reduce"> Reducir movimiento</label>
  </div>
  <div class="row">
    <button class="btn-primary" id="replay">Repetir animación</button>
    <button class="btn-soft" id="reset">Valores iniciales</button>
  </div>
  <code id="summary"></code>
</div>

<script>
  const MESSAGES = [
    { text: 'Eres más fuerte de lo que crees, y hoy también lo vas a lograr.', author: 'Ana' },
    { text: 'Me encanta cómo te ríes cuando algo te sale bien.', author: 'Mamá' },
    { text: 'Un paso pequeño sigue siendo un paso. Estoy orgullosa de ti.', author: null },
    { text: 'Gracias por cuidarme siempre, aunque no te lo diga 💛', author: 'Sofi' },
    { text: 'Respira. No tienes que tenerlo todo resuelto hoy.', author: 'VittalMind' },
  ];
  // Bolsa simple solo para el prototipo: no repite hasta agotar los 5.
  let bag = [];
  let last = null;
  function nextMessage() {
    if (bag.length === 0) {
      bag = MESSAGES.map((_, i) => i).filter((i) => MESSAGES.length < 2 || i !== last);
      if (last !== null && MESSAGES.length > 1) bag.push(last);
      // el último de la bolsa anterior va al final de la nueva, nunca primero
      const tail = last !== null ? bag.pop() : null;
      for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; }
      if (tail !== null) bag.push(tail);
    }
    last = bag.shift();
    return MESSAGES[last];
  }

  // Curvas: equivalentes a Easing.bezier(...) de Reanimated.
  const EASE = {
    wobble: 'cubic-bezier(0.36, 0, 0.66, 1)',
    lid: 'cubic-bezier(0.34, 1.56, 0.64, 1)',     // pequeño rebote al abrir
    particles: 'cubic-bezier(0.22, 1, 0.36, 1)',
    card: 'cubic-bezier(0.16, 1, 0.3, 1)',         // sale rápido y se asienta suave
    fade: 'cubic-bezier(0.4, 0, 0.2, 1)',
  };
  const DEFAULTS = { wobble: 400, lid: 350, particles: 300, card: 550 };
  const $ = (id) => document.getElementById(id);
  const t = () => ({ wobble: +$('t-wobble').value, lid: +$('t-lid').value, particles: +$('t-particles').value, card: +$('t-card').value });

  function refreshLabels() {
    const v = t();
    for (const k of Object.keys(v)) $('v-' + k).textContent = v[k];
    const total = $('reduce').checked ? 200 : v.wobble + v.lid + v.particles * 0.4 + v.card;
    $('summary').textContent =
      `CAJA_TIMINGS = { wobble: ${v.wobble}, lid: ${v.lid}, particles: ${v.particles}, card: ${v.card} }\n` +
      `Total aprox.: ${Math.round(total)} ms (las partículas se solapan con la tarjeta)`;
  }
  ['t-wobble','t-lid','t-particles','t-card','reduce'].forEach((id) => $(id).addEventListener('input', refreshLabels));
  $('reset').onclick = () => { for (const k in DEFAULTS) $('t-' + k).value = DEFAULTS[k]; refreshLabels(); };

  const NS = 'http://www.w3.org/2000/svg';
  const PARTICLE_COLORS = ['var(--secondaryContainer)', 'var(--primaryFixedDim)', 'var(--accent)', 'var(--primaryFixed)', 'var(--tertiaryFixed)'];
  function spawnParticles(duration) {
    const g = $('particles');
    g.innerHTML = '';
    const anims = [];
    for (let i = 0; i < 14; i++) {
      const c = document.createElementNS(NS, i % 3 === 0 ? 'rect' : 'circle');
      if (c.tagName === 'rect') { c.setAttribute('x', 116); c.setAttribute('y', 106); c.setAttribute('width', 8); c.setAttribute('height', 8); c.setAttribute('rx', 2); }
      else { c.setAttribute('cx', 120); c.setAttribute('cy', 110); c.setAttribute('r', 4 + (i % 3)); }
      c.setAttribute('fill', PARTICLE_COLORS[i % PARTICLE_COLORS.length]);
      c.style.transformBox = 'view-box';
      c.style.transformOrigin = '120px 110px';
      g.appendChild(c);
      const angle = (-160 + (140 / 13) * i) * Math.PI / 180 + (Math.random() - 0.5) * 0.2;
      const dist = 70 + Math.random() * 40;
      const dx = Math.cos(angle) * dist, dy = Math.sin(angle) * dist;
      anims.push(c.animate([
        { transform: 'translate(0,0) scale(.4) rotate(0deg)', opacity: 0 },
        { opacity: 1, offset: 0.2 },
        { transform: `translate(${dx}px, ${dy}px) scale(1) rotate(${Math.random() * 180}deg)`, opacity: 0 },
      ], { duration: Math.max(duration, 1) * 1.6, easing: EASE.particles, fill: 'forwards' }));
    }
    return anims;
  }

  let busy = false;
  let open = false;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  async function play() {
    if (busy) return;
    if (open) { await closeCard(); }
    busy = true;
    $('hint').style.visibility = 'hidden';
    const m = nextMessage();
    $('msg').textContent = m.text;
    $('author').textContent = m.author ? `— ${m.author}` : '';
    $('del').style.display = m.author === 'VittalMind' ? 'none' : '';
    const v = t();
    const card = $('card'), scrim = $('scrim');

    if ($('reduce').checked) {
      scrim.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, easing: EASE.fade, fill: 'forwards' });
      await card.animate([
        { transform: 'translate(-50%, -50%) scale(1)', opacity: 0 },
        { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
      ], { duration: 200, easing: EASE.fade, fill: 'forwards' }).finished;
    } else {
      // 1. Balanceo (dos vaivenes)
      if (v.wobble > 0) {
        await $('wobble').animate([
          { transform: 'rotate(0deg)' }, { transform: 'rotate(-6deg)' }, { transform: 'rotate(5deg)' },
          { transform: 'rotate(-4deg)' }, { transform: 'rotate(3deg)' }, { transform: 'rotate(0deg)' },
        ], { duration: v.wobble, easing: EASE.wobble }).finished;
      }
      // 2. La tapa se abre girando hacia atrás
      const lid = $('lid').animate([
        { transform: 'translate(0,0) rotate(0deg)' },
        { transform: 'translate(-6px,-26px) rotate(-38deg)' },
      ], { duration: v.lid, easing: EASE.lid, fill: 'forwards' });
      await lid.finished;
      // 3. Partículas + 4. tarjeta (la tarjeta arranca al 40% de las partículas)
      spawnParticles(v.particles);
      await wait(v.particles * 0.4);
      scrim.animate([{ opacity: 0 }, { opacity: 1 }], { duration: v.card, easing: EASE.fade, fill: 'forwards' });
      await card.animate([
        { transform: 'translate(-50%, 10%) scale(.2)', opacity: 0 },
        { transform: 'translate(-50%, -58%) scale(1.03)', opacity: 1, offset: 0.75 },
        { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
      ], { duration: v.card, easing: EASE.card, fill: 'forwards' }).finished;
    }
    card.style.pointerEvents = 'auto';
    open = true;
    busy = false;
    $('close').focus();
  }

  async function closeCard() {
    const card = $('card');
    card.style.pointerEvents = 'none';
    $('scrim').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, easing: EASE.fade, fill: 'forwards' });
    await card.animate([
      { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
      { transform: 'translate(-50%, -50%) scale(.9)', opacity: 0 },
    ], { duration: 200, easing: EASE.fade, fill: 'forwards' }).finished;
    // la caja vuelve a cerrarse
    $('lid').getAnimations().forEach((a) => a.cancel());
    $('particles').innerHTML = '';
    $('hint').style.visibility = 'visible';
    open = false;
  }

  $('box').addEventListener('click', play);
  $('box').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); play(); } });
  $('replay').onclick = play;
  $('again').onclick = play;
  $('close').onclick = closeCard;
  $('del').onclick = () => { if (confirm('¿Borrar este mensaje? No se puede deshacer.')) closeCard(); };
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) $('reduce').checked = true;
  refreshLabels();
</script>
</body>
</html>
