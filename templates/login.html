<style>
        body {

            font-family: 'Inter', sans-serif;

<body class="bg-soft-gradient min-h-screen flex flex-col items-center justify-center p-container-padding-mobile">
<!-- Login Container -->
<main class="w-full max-w-[440px] flex flex-col items-center animate-in fade-in slide-in-from-bottom-4 duration-1000">
<!-- Brand Identity -->
<header class="text-center mb-stack-lg">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary mb-stack-md shadow-[0px_4px_20px_rgba(45,97,130,0.15)]">
<span class="material-symbols-outlined text-white text-3xl" data-icon="spa" style="font-variation-settings: 'FILL' 1;">spa</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight mb-2">Vitta Mind</h1>
</header>
<!-- Form Card -->
<section class="w-full glass-card rounded-[2rem] p-stack-md md:p-stack-lg shadow-[0px_10px_30px_rgba(0,0,0,0.04)] mb-stack-md">
<div class="mb-stack-md text-center">
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Bienvenido a tu espacio de paz</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Inicia sesión para continuar tu camino</p>
</div>
<form class="space-y-stack-md" onsubmit="event.preventDefault()">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="email">Correo electrónico</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline" data-icon="mail">mail</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface-container-lowest border-none rounded-xl font-body-md text-on-surface ring-1 ring-inset ring-surface-variant focus:ring-2 focus:ring-primary transition-all placeholder:text-outline/50" id="email" placeholder="nombre@ejemplo.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Contraseña</label>
<button class="font-label-md text-label-md text-primary hover:underline transition-all" type="button">¿Olvidaste tu contraseña?</button>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline" data-icon="lock">lock</span>
<input class="w-full h-14 pl-12 pr-12 bg-surface-container-lowest border-none rounded-xl font-body-md text-on-surface ring-1 ring-inset ring-surface-variant focus:ring-2 focus:ring-primary transition-all placeholder:text-outline/50" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Primary Action -->
<button class="w-full h-14 bg-primary text-white font-label-md text-label-md rounded-full shadow-lg shadow-primary/20 hover:bg-primary-container active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2 mt-stack-md" type="submit">
                    Iniciar Sesión
                </button>
</form>
<!-- Social Divider -->
<div class="relative my-stack-md flex items-center py-2">
<div class="flex-grow border-t border-surface-variant"></div>
<span class="flex-shrink mx-4 font-label-sm text-label-sm text-outline uppercase tracking-widest">O continúa con</span>
<div class="flex-grow border-t border-surface-variant"></div>
</div>
<!-- Social Login -->
<button class="w-full h-14 bg-white border border-surface-variant rounded-full flex items-center justify-center gap-3 hover:bg-surface-container-lowest active:scale-[0.98] transition-all duration-200 shadow-sm">
<svg height="20" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="font-label-md text-label-md text-on-surface">Google</span>
</button>
</section>
<!-- Secondary Link -->
<footer class="mt-stack-sm text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                ¿No tienes cuenta? 
                <a class="font-label-md text-label-md text-primary font-semibold hover:underline ml-1" href="#">Regístrate</a>
</p>
</footer>
</main>
<!-- Decorative Atmosphere (Soft Circles) -->
<div class="fixed top-[-10%] left-[-10%] w-[40%] h-[40%] bg-secondary-container/20 rounded-full blur-[100px] pointer-events-none -z-10"></div>
<div class="fixed bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-primary-fixed-dim/20 rounded-full blur-[100px] pointer-events-none -z-10"></div>
<script>
        // Micro-interaction: Form input focus state animations
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });

        // Toggle password visibility (demo only)
        const toggleBtn = document.querySelector('button span[data-icon="visibility"]');
        if (toggleBtn) {
            toggleBtn.parentElement.addEventListener('click', () => {
                const passwordInput = document.getElementById('password');
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                toggleBtn.textContent = isPassword ? 'visibility_off' : 'visibility';
            });
        }
    </script>
</body></html>
